name: Build

on:
  push:
    branches: [main]
  pull_request:
  # release.yml: the same jobs, also attesting the version's packages.
  workflow_call:
    inputs:
      version:
        description: Release version (vX.Y.Z)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}

defaults:
  run:
    shell: bash   # -eo pipefail

env:
  # An exact Task version skips setup-task's release lookup, which fails
  # whenever the GitHub API answers without 3.x releases. Renovate updates it
  # through customManagers:githubActionsVersions (in the actions-fyi preset).
  # renovate: datasource=github-releases depName=go-task/task extractVersion=^v(?<version>.+)$
  TASK_VERSION: 3.54.0

# Actions are pinned to commit SHAs; Renovate keeps them current.
jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod   # caches modules and build cache, keyed on go.sum
      - uses: step-security/go-task-setup-task@v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - name: vet and unit tests
        run: task test 2>&1 | tee unit.log
      - name: integration tests (root, network namespaces)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq nftables conntrack iputils-ping
          # Root reuses the runner's caches instead of starting empty.
          sudo env "PATH=$PATH" GOCACHE="$(go env GOCACHE)" GOMODCACHE="$(go env GOMODCACHE)" \
            task integration 2>&1 | tee integration.log
      - name: annotate test failures
        if: failure()
        run: |
          # One annotation per failed step with the failing tests' output, so
          # the cause shows on the run page without opening the log.
          for log in unit.log integration.log; do
            if [ ! -f "$log" ] || ! grep -q -E '^(--- FAIL|FAIL|panic:)' "$log"; then
              continue
            fi
            msg=$(grep -E -B2 -A25 '^\s*(--- FAIL|panic:)|_test\.go:[0-9]+:' "$log" | head -200 |
              sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=go test failed ($log)::$msg"
          done

  ipk:
    name: IPK
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Signed provenance and SBOM attestations on releases:
      id-token: write          # OIDC token to sign the attestations with Sigstore
      attestations: write      # store the attestations on the repository
      artifact-metadata: write # link the attestations to the built packages
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: step-security/go-task-setup-task@v2.2.0
        with:
          version: ${{ env.TASK_VERSION }}
      - name: build packages
        env:
          VERSION: ${{ inputs.version }}
        run: task ipk ${VERSION:+"VERSION=$VERSION"}
      - name: install and run on OpenWrt (procd)
        run: packaging/openwrt/smoke-test.sh bin/tunsel_*_x86_64.ipk bin/luci-app-tunsel_*_all.ipk
      - name: attest build provenance
        if: inputs.version != ''
        uses: actions/attest@v4.2.2
        with:
          subject-path: bin/*.ipk
      # One SBOM for all packages, from what they install: syft reads the Go
      # modules from each binary's build info.
      - name: unpack packages
        if: inputs.version != ''
        run: |
          for ipk in bin/*.ipk; do
            dir=sbom-root/$(basename "$ipk" .ipk)
            mkdir -p "$dir"
            tar -xzOf "$ipk" ./data.tar.gz | tar -xz -C "$dir"
          done
      - name: generate SBOM
        if: inputs.version != ''
        uses: anchore/sbom-action@v0.24.3
        with:
          path: sbom-root
          format: spdx-json
          output-file: bin/tunsel.spdx.json
          upload-release-assets: false
      - name: attest SBOM
        if: inputs.version != ''
        uses: actions/attest@v4.2.2
        with:
          subject-path: bin/*.ipk
          sbom-path: bin/tunsel.spdx.json
      # release.yml attaches these to the draft release.
      - name: keep packages for the release
        if: inputs.version != ''
        uses: actions/upload-artifact@v7.0.2
        with:
          name: packages
          path: |
            bin/*.ipk
            bin/tunsel.spdx.json
          if-no-files-found: error
