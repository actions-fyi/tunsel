name: Lint
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  actions:
    name: GitHub Actions
    runs-on: ubuntu-latest
    concurrency:
      group: lint-${{ github.ref }}
    permissions:
      contents: read # Read workflow files
      pull-requests: write # For review permission
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2.22.4
        with:
          egress-policy: audit

      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Run actionlint
        uses: kjanat/actionlint@v1.17.1
        with:
          review: true
